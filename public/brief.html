<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brief · SelectProperty</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .brief-detail-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; gap: 20px; }
    .brief-detail-head h1 { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 6px; }
    .brief-detail-meta { display: flex; align-items: center; gap: 10px; color: var(--text-3); font-size: 13px; }
    .brief-detail-meta .sep { color: var(--border-strong); }
    .brief-detail-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .detail-row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 0.5px solid var(--divider); font-size: 13.5px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-key { font-weight: 500; color: var(--text); min-width: 180px; flex-shrink: 0; }
    .detail-val { color: var(--text-2); flex: 1; word-break: break-word; }
    .detail-val.empty { color: var(--text-3); font-style: italic; }
    .edit-hint { background: var(--tint-blue); border: 0.5px solid #B8CBE8; color: var(--tint-blue-t); padding: 10px 14px; border-radius: var(--r); font-size: 12.5px; margin-bottom: 20px; }
    .danger-zone { margin-top: 32px; padding-top: 24px; border-top: 0.5px solid var(--border); }
    .danger-zone h3 { font-size: 12px; font-weight: 500; color: var(--text-3); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; }
    .danger-zone p { font-size: 12.5px; color: var(--text-3); margin-bottom: 12px; line-height: 1.55; }
  </style>
</head>
<body>
  <div id="shell">
    <div id="sidebar"></div>
    <div id="workspace">
      <div id="topbar">
        <div class="tb-trail" id="tb-trail"></div>
        <div class="tb-right" id="tb-actions"></div>
      </div>
      <div id="body">
        <div id="brief-content">
          <div class="empty-state">Loading brief…</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/brief.js"></script>
</body>
</html>
